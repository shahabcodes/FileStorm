name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Restore signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/filestorm.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/filestorm.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FileStorm-v${{ steps.version.outputs.version }}.apk

      - name: Remove old APKs from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            gh release delete-asset latest "$asset" --repo ${{ github.repository }} --yes
          done || true

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: |
            Built from commit ${{ github.sha }} at ${{ github.event.head_commit.timestamp }}.

            ${{ github.event.head_commit.message }}
          files: FileStorm-v${{ steps.version.outputs.version }}.apk
